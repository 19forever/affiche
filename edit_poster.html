<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor plakátů - Affiche Archive</title>
  
  <meta name="robots" content="noindex, nofollow">

  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- Viewer.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>

  <style>
    .editor-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 25px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-action {
      background-color: #222;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-action:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
    .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-green { background-color: #16a34a; color: #fff; border: none; }
    .btn-green:hover { background-color: #15803d; color: #fff; }

    .btn-gold { background-color: var(--accent-gold); color: #000; border: none; }
    .btn-gold:hover { background-color: #b89628; color: #000; }

    .btn-red { background-color: #ef4444; color: #fff; border: none; }
    .btn-red:hover { background-color: #dc2626; color: #fff; }

    .editor-layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 25px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .editor-layout { grid-template-columns: 1fr; }
    }

    .preview-box {
      position: sticky;
      top: 20px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }

    .preview-img-container {
      width: 100%;
      aspect-ratio: 3 / 4;
      background-color: #000;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-img-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: zoom-in;
    }

    .thumb-list { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    .thumb-item { width: 50px; height: 65px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border-color); cursor: pointer; opacity: 0.5; }
    .thumb-item.active { opacity: 1; border-color: var(--accent-gold); }

<!-- Inbox nepřiřazených skenů (Skenování složky /scans přes GitHub API) -->
<div style="margin-top: 15px; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 8px;">
  <h4 style="margin: 0 0 8px 0; font-size: 0.85rem; color: var(--accent-gold); display: flex; align-items: center; justify-content: space-between;">
    <span>📂 Nepřiřazené skeny</span>
    <span id="unassignedCountBadge" style="font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 10px; color: var(--text-muted); display: none;">0</span>
  </h4>
  <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; line-height: 1.4;">
    Vyhledá obrázky nahrané ve složce <code>/scans/</code>, které ještě nejsou propojené s žádným plakátem v Supabase.
  </p>
  <button type="button" class="btn-action" id="btnScanFolder" onclick="scanUnassignedImages()" style="width: 100%; margin-top: 6px;">
    🔍 Prohledat složku /scans/
  </button>
  <div id="unassignedScansList" style="margin-top: 10px; max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;"></div>
</div>
    
    .form-section {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .form-section h3 {
      font-size: 0.9rem;
      color: var(--accent-gold);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .form-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

    @media (max-width: 600px) {
      .form-grid-3, .form-grid-2 { grid-template-columns: 1fr; }
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }

    #statusMessage {
      margin-top: 15px;
      padding: 12px 16px;
      border-radius: 6px;
      display: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- ADMIN LOGIN GATE MODAL -->
  <div id="gateModal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; width: 100%; max-width: 380px;">
      <div style="text-align: center; font-size: 2rem; margin-bottom: 10px;">🔒</div>
      <h2 style="text-align: center; color: var(--accent-gold); margin-bottom: 6px; font-size: 1.25rem;">Admin Přihlášení</h2>
      <p style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 20px;">Správa sbírky plakátů Affiche.</p>

      <form onsubmit="event.preventDefault(); handleSupabaseLogin();">
        <div style="margin-bottom: 12px;">
          <label>EMAIL</label>
          <input type="email" id="loginEmail" placeholder="admin@domain.cz" required>
        </div>

        <div style="margin-bottom: 18px;">
          <label>HESLO</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <div id="loginError" style="display: none; color: #ef4444; font-size: 0.8rem; margin-bottom: 12px; text-align: center;"></div>

        <button type="submit" class="btn-action btn-green" style="width: 100%; padding: 10px;">
          🔓 Přihlásit se
        </button>
      </form>

      <div style="text-align: center; margin-top: 15px;">
        <a href="index.html" style="color: var(--accent-gold); text-decoration: none; font-size: 0.8rem;">◄ Zpět na Sbírku</a>
      </div>
    </div>
  </div>

  <div class="container" style="padding-top: 20px;">
    <!-- Hlavička Editoru -->
    <header class="top-header" style="margin-bottom: 20px; padding: 10px 0;">
      <div class="header-content">
        <h1>
          ✏️ Editor plakátů <span id="recordIdTitle" style="color: var(--accent-gold);">...</span>
        </h1>
        <div style="display: flex; gap: 10px;">
          <button class="btn-action btn-red" onclick="lockAdminSession()">🔒 Odhlásit</button>
          <a href="index.html" class="btn-action">◄ Zpět na Sbírku</a>
        </div>
      </div>
    </header>

    <!-- Navigační lišta mezi záznamy a správa akcí -->
    <div class="editor-nav">
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="btn-action" id="prevBtn" onclick="navigateRecord(-1)">◄</button>
        <span id="recordCounter" style="color: var(--accent-gold); font-weight: 700; font-size: 0.85rem;">Plakát 0 z 0</span>
        <button class="btn-action" id="nextBtn" onclick="navigateRecord(1)">►</button>
      </div>

      <select id="recordSelect" style="max-width: 280px; padding: 6px 10px;" onchange="jumpToSelectedRecord()"></select>

      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn-action btn-green" onclick="addNewRecord()">➕ Přidat nový</button>
        <button class="btn-action btn-gold" onclick="duplicateCurrentRecord()">📋 Duplikovat</button>
        <button class="btn-action btn-red" onclick="deleteCurrentRecord()">🗑️ Smazat</button>
      </div>
    </div>

    <!-- Hlavní editační plocha -->
    <div class="editor-layout">
      <!-- Levý sloupec: Náhled -->
      <div class="preview-box">
        <h3 style="font-size: 0.75rem; color: var(--accent-gold); margin-bottom: 10px; text-transform: uppercase;">🔍 Náhled plakátu</h3>
        <div class="preview-img-container">
          <img id="previewImg" src="" alt="Náhled">
        </div>
        <div class="thumb-list" id="thumbList"></div>
      </div>

      <!-- Pravý sloupec: Formulář -->
      <form id="editForm" onsubmit="event.preventDefault();">
        <div class="form-section">
          <h3>Základní údaje</h3>
          <div class="form-grid-3">
            <div class="form-group">
              <label for="edit_id">ID Plakátu</label>
              <input type="text" id="edit_id" name="id" readonly style="opacity: 0.5;">
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label for="edit_title">Název plakátu</label>
              <input type="text" id="edit_title" name="title" required>
            </div>
          </div>

          <div class="form-grid-3">
            <div class="form-group">
              <label for="edit_author">Autor / Výtvarník</label>
              <input type="text" id="edit_author" name="author" placeholder="např. Alphonse Mucha">
            </div>
            <div class="form-group">
              <label for="edit_client">Klient / Zadavatel</label>
              <input type="text" id="edit_client" name="client">
            </div>
            <div class="form-group">
              <label for="edit_product_subject">Produkt / Téma</label>
              <input type="text" id="edit_product_subject" name="product_subject">
            </div>
          </div>

          <div class="form-grid-3">
            <div class="form-group">
              <label for="edit_period_era">Období / Styl</label>
              <select id="edit_period_era" name="period_era">
                <option value="Secese">Secese</option>
                <option value="Art Deco">Art Deco</option>
                <option value="První republika">První republika</option>
                <option value="Bauhaus">Bauhaus</option>
                <option value="Předválečné">Předválečné</option>
              </select>
            </div>
            <div class="form-group">
              <label for="edit_year">Rok (číslo)</label>
              <input type="number" id="edit_year" name="year" placeholder="1925">
            </div>
            <div class="form-group">
              <label for="edit_year_approx">Přibližný rok / text</label>
              <input type="text" id="edit_year_approx" name="year_approx" placeholder="ca. 1925">
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label for="edit_printer">Tiskař / Tiskárna</label>
              <input type="text" id="edit_printer" name="printer">
            </div>
            <div class="form-group">
              <label for="edit_dimensions">Rozměry</label>
              <input type="text" id="edit_dimensions" name="dimensions" placeholder="např. 60 x 90 cm">
            </div>
          </div>

          <div class="form-group">
            <label for="edit_note">Poznámka / Popis</label>
            <textarea id="edit_note" name="note" rows="3"></textarea>
          </div>
        </div>

        <div class="form-section">
          <h3>Soubory a Zobrazení</h3>
          <div class="form-grid-2">
            <div class="form-group">
              <label for="edit_soubor_hlavni">Hlavní sken (soubor)</label>
              <input type="text" id="edit_soubor_hlavni" name="soubor_hlavni" placeholder="plakat_01.jpg" oninput="updateImageFromInput()">
            </div>
            <div class="form-group">
              <label for="edit_soubory_detaily">Detailní skeny (oddělené čárkou)</label>
              <input type="text" id="edit_soubory_detaily" name="soubory_detaily" placeholder="det_01.jpg, det_02.jpg" oninput="updateImageFromInput()">
            </div>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end;">
          <button type="button" class="btn-action btn-green" style="padding: 12px 24px; font-size: 1rem;" onclick="saveCurrentRecordToSupabase()">
            🚀 Uložit do Supabase
          </button>
        </div>

        <div id="statusMessage"></div>
      </form>
    </div>
  </div>

  <script src="edit_poster.js"></script>
</body>
</html>
