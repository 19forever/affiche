<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiche - Sbírka reklamních plakátů</title>
  
  <meta name="description" content="Digitální archiv a sbírka historických reklamních plakátů a časopisecké grafiky.">
  <meta name="theme-color" content="#f59e0b">

  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- Viewer.js (Prohlížeč obrázků) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
</head>
<body>

  <div class="top-header-container">
    <header>
      <div class="header-left">
        <div class="logo">AF</div>
        <div class="title-area">
          <h1>Affiche <span class="year-badge" id="yearBadge">Art Poster Archive</span></h1>
          <p>Kolekce historických reklamních plakátů a časopisecké grafiky</p>
        </div>
      </div>

      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <button id="adminLockBtn" class="btn-contribute" style="display: none; background: #dc2626; color: #ffffff; border: none; cursor: pointer; font-family: inherit;" onclick="lockAdminSession()" title="Odhlásit admina">
          🔒 Odhlásit
        </button>
        <a href="edit_poster.html" id="adminEditorLink" class="btn-contribute" style="display: none;" title="Otevřít Editor plakátů">
          ✏️ Editor
        </a>
        <button type="button" id="adminLoginLink" class="btn-contribute" style="background: transparent; border: 1px solid var(--border-color-light, #333); cursor: pointer; font-family: inherit;" onclick="handleAdminLogin()" title="Přihlášení admina">
          🔒 Admin
        </button>
      </div>
    </header>

    <div class="category-tabs" id="categoryTabs"></div>

    <div class="controls">
      <div class="search-input-wrapper">
        <input type="text" id="searchInput" placeholder="🔍 Hledat podle názvu, autora, klienta, produktu..." autofocus>
        <button class="search-clear-btn" id="searchClearBtn" title="Vymazat hledání">✕</button>
      </div>

      <select id="eraFilter" title="Filtrovat podle období">
        <option value="">Všechna období</option>
      </select>

      <select id="sortFilter" title="Řazení plakátů">
        <option value="newest">Nejnovější přidané</option>
        <option value="oldest">Rok (Od nejstarších)</option>
        <option value="year_desc">Rok (Od nejnovějších)</option>
      </select>

      <select id="pageSizeFilter">
        <option value="25">25 / str</option>
        <option value="50" selected>50 / str</option>
        <option value="100">100 / str</option>
        <option value="ALL">VŠECHNY</option>
      </select>
      <div class="layout-toggles">
        <button class="toggle-btn active" id="btnGrid">⊞</button>
        <button class="toggle-btn" id="btnList">≡</button>
      </div>
    </div>
  </div>

  <div id="postersContainer" class="tickets-container grid-view"></div>
  <div id="paginationContainer" class="pagination-container"></div>

  <!-- Aplikace Scripts -->
  <script src="app.js"></script>

  <footer class="jj-museum-footer">
    <div class="footer-container">
      <p class="disclaimer-title">📜 Affiche - Poster Archive</p>
      <p class="disclaimer-text">
        Nekomerční sbírkový archiv zaměřený na historickou knižní a plakátovou grafiku.
      </p>
    </div>
  </footer>

</body>
</html>
