<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiche - Sbírka reklamních plakátů</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <!-- Transformers.js pro AI vyhledávání -->
  <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js"></script>

  <!-- Viewer.js (Prohlížeč obrázků) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
</head>
<body>

  <header class="top-header">
    <div class="container">
      <div class="header-content">
        <div>
          <h1>Affiche <span>Art Poster Archive</span></h1>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Kolekce historických reklamních plakátů a časopisecké grafiky</p>
        </div>

        <!-- Tlačítka správy / Editoru pro admina -->
        <div style="display: flex; gap: 10px; align-items: center;">
          <a href="edit_poster.html" id="adminEditorBtn" style="display: none; background: var(--accent-gold); color: #000; font-weight: bold; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 0.9rem;" title="Otevřít Editor plakátů">
            ✏️ Editor
          </a>
          <button id="adminLoginBtn" onclick="window.location.href='edit_poster.html'" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">
            🔒 Admin
          </button>
          <button id="adminLogoutBtn" onclick="handleLogout()" style="display: none; background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">
            Odhlásit
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="🔍 Hledat podle názvu, autora, značky nebo AI vizuálu (např. 'moře', 'flakon')...">
      </div>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <select id="eraFilter">
          <option value="">Všechna období</option>
          <option value="Secese">Secese</option>
          <option value="Art Deco">Art Deco</option>
          <option value="První republika">První republika</option>
          <option value="Bauhaus">Bauhaus</option>
          <option value="Předválečné">Předválečné</option>
        </select>

        <select id="sortFilter">
          <option value="newest">Nejnovější přidané</option>
          <option value="year_asc">Rok (Od nejstarších)</option>
          <option value="year_desc">Rok (Od nejnovějších)</option>
        </select>
      </div>
    </div>

    <div id="postersGrid" class="posters-grid">
      <!-- Sem se dynamicky načítají karty plakátů -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
