<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiche - Art Poster Archive</title>
  <!-- Favicon Affiche (Art Deco Monogram) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f0f0f'/><circle cx='32' cy='32' r='27' fill='none' stroke='%23d4af37' stroke-width='2'/><circle cx='32' cy='32' r='24' fill='none' stroke='%23d4af37' stroke-width='0.75' stroke-dasharray='2 2'/><text x='32' y='41' font-family='serif' font-size='26' font-weight='900' fill='%23d4af37' text-anchor='middle'>AF</text></svg>">

  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- Viewer.js pro detailní prohlížení skenů -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>

  <style>
    .admin-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-admin {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-admin:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }
    .btn-admin-logout {
      background: #dc2626;
      border: none;
      color: #fff;
    }
    .btn-admin-logout:hover {
      background: #b91c1c;
      color: #fff;
    }
    .btn-card-edit {
      margin-top: 6px;
      align-self: flex-start;
      background: #1f2937;
      border: 1px solid var(--border-color);
      color: var(--accent-gold);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .btn-card-edit:hover {
      background: #374151;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Hlavička -->
    <header class="top-header">
      <div class="header-content">
        <h1>
          Affiche
          <span>Art Poster Archive – Sbírka reklamních plakátů</span>
        </h1>

        <div class="admin-actions">
          <button type="button" id="adminLockBtn" class="btn-admin btn-admin-logout" style="display: none;" onclick="lockAdminSession()">
            🔒 Odhlásit
          </button>
          <a href="edit_poster.html" id="adminEditorLink" class="btn-admin" style="display: none;">
            ✏️ Editor
          </a>
          <button type="button" id="adminLoginLink" class="btn-admin" onclick="openLoginModal()">
            🔒 Admin
          </button>
        </div>
      </div>
    </header>

    <!-- Ovládací prvky a vyhledávání -->
    <div class="controls">
      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="🔍 Hledat podle názvu, autora, klienta, produktu..." autofocus>
      </div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <select id="eraFilter" style="flex: 1; min-width: 150px;">
          <option value="">Všechna období</option>
        </select>

        <select id="sortFilter" style="flex: 1; min-width: 150px;">
          <option value="newest">Nejnovější přidané</option>
          <option value="oldest">Rok (Od nejstarších)</option>
          <option value="year_desc">Rok (Od nejnovějších)</option>
        </select>

        <select id="pageSizeFilter" style="width: auto;">
          <option value="25">25 / str</option>
          <option value="50" selected>50 / str</option>
          <option value="100">100 / str</option>
          <option value="ALL">VŠECHNY</option>
        </select>
      </div>
    </div>

    <!-- Mřížka s plakáty -->
    <div id="postersContainer" class="posters-grid"></div>

    <!-- Stránkování -->
    <div id="paginationContainer" style="display: flex; gap: 8px; justify-content: center; margin-top: 30px; flex-wrap: wrap;"></div>
  </div>

<!-- MODAL PRO POZNÁMKU / POPIS -->
<div id="noteModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(6px); align-items: center; justify-content: center; z-index: 9999;">
  <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; width: 90%; max-width: 500px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
      <h3 id="noteModalTitle" style="color: var(--accent-gold); font-size: 1.1rem; font-weight: 600; margin: 0;">📝 Poznámka k plakátu</h3>
      <button type="button" onclick="closeNoteModal()" style="background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; line-height: 1;">✖</button>
    </div>
    <div id="noteModalText" style="color: var(--text-main); font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; max-height: 60vh; overflow-y: auto; padding-right: 5px;">
      <!-- Sem se vloží text poznámky -->
    </div>
    <div style="text-align: right; margin-top: 20px;">
      <button type="button" class="btn-admin" onclick="closeNoteModal()" style="padding: 6px 16px;">Zavřít</button>
    </div>
  </div>
</div>
  
  <!-- ADMIN LOGIN MODAL -->
  <div id="loginModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(6px); align-items: center; justify-content: center; z-index: 9999;">
    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; width: 100%; max-width: 380px;">
      <div style="text-align: center; font-size: 2rem; margin-bottom: 10px;">🔒</div>
      <h2 style="text-align: center; color: var(--accent-gold); margin-bottom: 6px; font-size: 1.25rem;">Admin Přihlášení</h2>
      <p style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 20px;">Zadejte přihlašovací údaje ze Supabase.</p>

      <form onsubmit="event.preventDefault(); handleSupabaseLoginIndex();">
        <div style="margin-bottom: 12px;">
          <label style="display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600;">EMAIL</label>
          <input type="email" id="loginEmail" placeholder="admin@domain.cz" style="width: 100%;" required>
        </div>

        <div style="margin-bottom: 18px;">
          <label style="display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600;">HESLO</label>
          <input type="password" id="loginPassword" placeholder="••••••••" style="width: 100%;" required>
        </div>

        <div id="loginError" style="display: none; color: #ef4444; font-size: 0.8rem; margin-bottom: 12px; text-align: center;"></div>

        <button type="submit" class="btn-admin" style="width: 100%; justify-content: center; background: #16a34a; color: #fff; border: none; padding: 10px; font-weight: 700;">
          🔓 Přihlásit se
        </button>
      </form>

      <div style="text-align: center; margin-top: 15px;">
        <button type="button" onclick="closeLoginModal()" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem;">Zrušit</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
